name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests

  # -------------------------------------------------------------------------
  typecheck:
    name: Typecheck (mypy --strict)
    runs-on: ubuntu-latest
    # Warn-only until the SQLAlchemy 2.x `Column[X]` vs `X` typing carryover
    # from Stage 0/1 is resolved (see docs/NEXT_SESSION.md "mypy cleanup").
    # Promote back to a hard gate once the service layer is annotated with
    # `Mapped[...]` or equivalent.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,test]"
      - run: mypy src

  # -------------------------------------------------------------------------
  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger_pass
          POSTGRES_DB: dutta_messenger_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      # alembic's migrations/env.py calls `Settings()` which reads DATABASE_URL.
      # In CI we only create one Postgres DB (dutta_messenger_test), so alias
      # DATABASE_URL to the same URL — otherwise `alembic upgrade head` would
      # try to connect to the default `dutta_messenger` and fail with
      # "database does not exist".
      DATABASE_URL: postgresql+asyncpg://messenger:messenger_pass@localhost:5432/dutta_messenger_test
      TEST_DATABASE_URL: postgresql+asyncpg://messenger:messenger_pass@localhost:5432/dutta_messenger_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,test]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: ./scripts/run_tests.sh
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/results/latest/
          retention-days: 14

  # -------------------------------------------------------------------------
  security:
    name: Security (pip-audit + detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: pip-audit
        run: pip-audit --strict || echo "::warning::pip-audit found advisories"
      - name: detect-secrets
        run: detect-secrets scan --baseline .secrets.baseline
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"      # warn-only while baselining; promote to "1" later
          ignore-unfixed: true
